<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoftCookies - Pesan Cookies Lembut</title>
</head>
<body>
    <!-- HEADER -->
    <header>
        <h1>🍪 SoftCookies Premium</h1>
        <p>Cookies lembut dibuat fresh setiap hari!</p>
        <button onclick="openWAForm()">📱 Pesan via WA</button>
    </header>

    <!-- PRODUCTS -->
    <section>
        <h2>Menu Cookies</h2>
        <div class="products">
            <div class="product">
                <h3>Choco Clasic</h3>
                <p>Rp 6.000</p>
                <button onclick="directWA('Choco Clasic - Rp6.000')">📱 WA</button>
                <button onclick="addToCart('Choco Clasic', 6000)">🛒 Keranjang</button>
            </div>

            <div class="product">
                <h3>Choco Cookies</h3>
                <p>Rp 6.000</p>
                <button onclick="directWA('Choco Cookies - Rp6.000')">📱 WA</button>
                <button onclick="addToCart('Choco Cookies', 6000)">🛒 Keranjang</button>
            </div>

            <div class="product">
                <h3>Choco Cheese</h3>
                <p>Rp 10.000</p>
                <button onclick="directWA('Choco Cheese- Rp10.000')">📱 WA</button>
                <button onclick="addToCart('Choco Cheese', 10000)">🛒 Keranjang</button>
            </div>

            <div class="product">
                <h3>Lotus Biscof</h3>
                <p>Rp 12.000</p>
                <button onclick="directWA('Lotus Biscof - Rp12.000')">📱 WA</button>
                <button onclick="addToCart('Lotus Biscof', 12000)">🛒 Keranjang</button>
            </div>

            <div class="product">
                <h3>Red Velvet Cheese Cookies</h3>
                <p>Rp 12.000</p>
                <button onclick="directWA('Red Velvet Cheese Cookies - Rp12.000')">📱 WA</button>
                <button onclick="addToCart('Red Velvet Cheese Cookies', 12000)">🛒 Keranjang</button>
            </div>

            <div class="product">
                <h3>Love Pack (6 pcs)</h3>
                <p>Rp 150.000</p>
                <button onclick="directWA('Love Pack 6pcs - Rp150.000')">📱 WA</button>
                <button onclick="addToCart('Love Pack (6 pcs)', 150000)">🛒 Keranjang</button>
            </div>
        </div>
    </section>

    <!-- KERANJANG -->
    <div>
        <h3>🛒 Keranjang (<span id="cartCount">0</span>)</h3>
        <div id="cartItems"></div>
        <button onclick="openWAForm()">📱 Checkout WA</button>
    </div>

    <!-- FORM WA MODAL -->
    <div id="waModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
        <div style="background:white; margin:10% auto; padding:20px; width:90%; max-width:400px; border-radius:10px;">
            <button onclick="closeWAForm()" style="float:right;">X</button>
            <h2>📱 Form Pesanan WA</h2>
            
            <div id="orderSummary" style="background:#f0f0f0; padding:10px; margin:10px 0; display:none;"></div>
            
            <form id="orderForm">
                <input type="text" id="customerName" placeholder="Nama Lengkap *" required><br><br>
                <input type="tel" id="customerPhone" placeholder="No WA (08++++)" required><br><br>
                <textarea id="customerAddress" placeholder="Alamat Lengkap *" rows="3" required></textarea><br><br>
                <textarea id="customerNotes" placeholder="Catatan (opsional)" rows="2"></textarea><br><br>
                <button type="submit">🚀 Kirim ke WA</button>
            </form>
        </div>
    </div>

    <!-- JAVASCRIPT CORE -->
    <script>
        // 🔥 NOMOR WA KAMU (GANTI SESUKA)
        const WA_NUMBER = '6285540186517';

        let cart = [];

        // Tambah ke keranjang
        function addToCart(name, price) {
            cart.push({name, price, quantity: 1});
            updateCart();
            alert(`${name} ditambahkan!`);
        }

        // Update tampilan keranjang
        function updateCart() {
            document.getElementById('cartCount').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartItems = document.getElementById('cartItems');
            if (cart.length === 0) {
                cartItems.innerHTML = '<p>Keranjang kosong</p>';
            } else {
                cartItems.innerHTML = cart.map((item, i) => 
                    `<div>${item.name} x${item.quantity} - Rp ${(item.price*item.quantity).toLocaleString()}
                    <button onclick="removeItem(${i})">Hapus</button></div>`
                ).join('') + `<br><strong>Total: Rp ${cart.reduce((sum,item)=>sum+(item.price*item.quantity),0).toLocaleString()}</strong>`;
            }
            updateOrderSummary();
        }

        // Hapus item
        function removeItem(index) {
            cart.splice(index, 1);
            updateCart();
        }

        // WA Langsung (1 produk)
        function directWA(product) {
            const message = `Halo! Mau pesan ${product} 😊`;
            window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`);
        }

        // Buka form WA
        function openWAForm() {
            document.getElementById('waModal').style.display = 'block';
            updateOrderSummary();
        }

        // Tutup form WA
        function closeWAForm() {
            document.getElementById('waModal').style.display = 'none';
        }

        // Update ringkasan pesanan di form
        function updateOrderSummary() {
            const summary = document.getElementById('orderSummary');
            if (cart.length > 0) {
                summary.style.display = 'block';
                summary.innerHTML = `<strong>Pesanan:</strong><br>` + 
                    cart.map(item => `${item.name} x${item.quantity} - Rp ${(item.price*item.quantity).toLocaleString()}`).join('<br>') +
                    `<br><strong>Total: Rp ${cart.reduce((sum,item)=>sum+(item.price*item.quantity),0).toLocaleString()}</strong>`;
            } else {
                summary.style.display = 'none';
            }
        }

        // Kirim pesanan ke WA
        document.getElementById('orderForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;
            const address = document.getElementById('customerAddress').value;
            const notes = document.getElementById('customerNotes').value;

            let message = ` *PESANAN SOFTCOOKIES*\n\n`;
            message += ` *Nama:* ${name}\n`;
            message += ` *WA:* ${phone}\n`;
            message += ` *Alamat:* ${address}\n\n`;

            if (cart.length > 0) {
                message += `📦 *Pesanan:*\n`;
                cart.forEach(item => {
                    message += `• ${item.name} (x${item.quantity}) - Rp ${(item.price*item.quantity).toLocaleString()}\n`;
                });
                message += `\n💰 *Total:* Rp ${cart.reduce((sum,item)=>sum+(item.price*item.quantity),0).toLocaleString()}\n\n`;
            }

            message += `📝 *Catatan:* ${notes || 'Tidak ada'}\n`;
            message += `⏰ *Waktu:* ${new Date().toLocaleString('id-ID')}`;

            window.open(`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(message)}`);
            
            this.reset();
            closeWAForm();
            cart = []; // Kosongkan keranjang
            updateCart();
            alert('✅ Pesanan terkirim ke WA!');
        });
    </script>
</body>
</html>
